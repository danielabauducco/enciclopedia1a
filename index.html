<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Enciclopedia · Expedición NOVA</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211711;font-family:Trebuchet MS,Arial,sans-serif}#app{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}#stage{position:relative;width:min(96vw,177.78vh);height:min(96vh,54vw);max-width:1600px;max-height:900px;background:#efe2c6;border:14px solid #4a2f20;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0007}#page{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}#mainImage{width:100%;height:100%;object-fit:contain;display:block}#clickLayer{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;background:transparent;border:0;cursor:pointer;pointer-events:auto;border-radius:8px}.hotspot:hover{background:#fff2;outline:3px solid #fff}#controls{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 10px;background:#2d1c13e8;border-radius:14px;opacity:0;transition:.2s}#stage:hover #controls{opacity:1}button{border:0;border-radius:9px;padding:9px 12px;background:#f6ead0;color:#3d281c;font-weight:700;cursor:pointer}#counter{color:white;min-width:60px;text-align:center;font-weight:700}
</style></head><body><div id="app"><div id="stage"><div id="page"><img id="mainImage"><div id="clickLayer"></div></div><div id="controls"><button id="prev">← ANTERIOR</button><button id="index">ÍNDICE</button><button id="next">SIGUIENTE →</button><span id="counter"></span><button id="full">⛶ PANTALLA COMPLETA</button></div></div></div>
<script>
const slides=[{"type": "image", "title": "TAPA", "src": "assets/tapa.webp"}, {"type": "index", "title": "ÍNDICE A–L", "src": "assets/indice_a_l.webp"}, {"type": "index", "title": "ÍNDICE M–Z", "src": "assets/indice_m_z.webp"}, {"type": "image", "title": "AJOLOTE", "src": "assets/01_ajolote.webp"}, {"type": "image", "title": "ARDILLA", "src": "assets/02_ardilla.webp"}, {"type": "image", "title": "BURRO", "src": "assets/03_burro.webp"}, {"type": "image", "title": "CAMALEÓN", "src": "assets/04_camaleon.webp"}, {"type": "image", "title": "CARACOL ZOMBIE", "src": "assets/05_caracol_zombie.webp"}, {"type": "image", "title": "COLIBRÍ", "src": "assets/06_colibri.webp"}, {"type": "image", "title": "CONEJO", "src": "assets/07_conejo.webp"}, {"type": "image", "title": "DRAGÓN", "src": "assets/08_dragon.webp"}, {"type": "image", "title": "GATO", "src": "assets/09_gato.webp"}, {"type": "image", "title": "HÁMSTER", "src": "assets/10_hamster.webp"}, {"type": "image", "title": "LEÓN", "src": "assets/11_leon.webp"}, {"type": "image", "title": "LOBO", "src": "assets/12_lobo.webp"}, {"type": "image", "title": "LORO", "src": "assets/13_loro.webp"}, {"type": "image", "title": "MARIPOSA", "src": "assets/14_mariposa.webp"}, {"type": "image", "title": "PERRO", "src": "assets/15_perro.webp"}, {"type": "image", "title": "PEZ GLOBO", "src": "assets/16_pez_globo.webp"}, {"type": "image", "title": "PINGÜINO", "src": "assets/17_ping_ino.webp"}, {"type": "image", "title": "POLLITO", "src": "assets/18_pollito.webp"}, {"type": "image", "title": "TIBURÓN", "src": "assets/19_tiburon.webp"}, {"type": "image", "title": "TIBURÓN MARTILLO", "src": "assets/20_tiburon_martillo.webp"}, {"type": "image", "title": "TIBURÓN TIGRE", "src": "assets/21_tiburon_tigre.webp"}, {"type": "image", "title": "TIGRE", "src": "assets/22_tigre.webp"}, {"type": "image", "title": "TORTUGA", "src": "assets/23_tortuga.webp"}],regions={"ÍNDICE A–L": [["AJOLOTE", 35, 350, 520, 455], ["ARDILLA", 35, 460, 520, 560], ["BURRO", 35, 570, 520, 675], ["CAMALEÓN", 35, 685, 520, 795], ["CARACOL ZOMBIE", 545, 350, 1015, 455], ["COLIBRÍ", 545, 460, 1015, 560], ["CONEJO", 545, 570, 1015, 675], ["DRAGÓN", 545, 685, 1015, 795], ["GATO", 1030, 350, 1500, 455], ["HÁMSTER", 1030, 460, 1500, 560], ["LEÓN", 1030, 570, 1500, 675], ["LOBO", 1030, 685, 1500, 795]], "ÍNDICE M–Z": [["LORO", 40, 355, 740, 440], ["MARIPOSA", 40, 455, 740, 540], ["PERRO", 40, 555, 740, 640], ["PEZ GLOBO", 40, 617, 740, 699], ["PINGÜINO", 40, 704, 740, 786], ["POLLITO", 40, 791, 740, 875], ["TIBURÓN", 815, 355, 1495, 440], ["TIBURÓN MARTILLO", 815, 455, 1495, 540], ["TIBURÓN TIGRE", 815, 555, 1495, 625], ["TIGRE", 815, 635, 1495, 715], ["TORTUGA", 815, 725, 1495, 810]]},target={"AJOLOTE": 3, "ARDILLA": 4, "BURRO": 5, "CAMALEÓN": 6, "CARACOL ZOMBIE": 7, "COLIBRÍ": 8, "CONEJO": 9, "DRAGÓN": 10, "GATO": 11, "HÁMSTER": 12, "LEÓN": 13, "LOBO": 14, "LORO": 15, "MARIPOSA": 16, "PERRO": 17, "PEZ GLOBO": 18, "PINGÜINO": 19, "POLLITO": 20, "TIBURÓN": 21, "TIBURÓN MARTILLO": 22, "TIBURÓN TIGRE": 23, "TIGRE": 24, "TORTUGA": 25};
let current=0;const img=document.getElementById('mainImage'),layer=document.getElementById('clickLayer'),page=document.getElementById('page');
function render(){layer.innerHTML='';const s=slides[current];img.src=s.src;img.alt=s.title;document.getElementById('counter').textContent=(current+1)+' / '+slides.length;if(s.type==='index')img.onload=()=>build(s.title)}
function build(title){layer.innerHTML='';const ir=img.getBoundingClientRect(),pr=page.getBoundingClientRect(),scale=Math.min(ir.width/img.naturalWidth,ir.height/img.naturalHeight),ox=(ir.width-img.naturalWidth*scale)/2,oy=(ir.height-img.naturalHeight*scale)/2;(regions[title]||[]).forEach(r=>{const[a,x1,y1,x2,y2]=r,b=document.createElement('button');b.className='hotspot';b.title=a;b.style.left=(ir.left-pr.left+ox+x1*scale)+'px';b.style.top=(ir.top-pr.top+oy+y1*scale)+'px';b.style.width=((x2-x1)*scale)+'px';b.style.height=((y2-y1)*scale)+'px';b.onclick=()=>{current=target[a];render()};layer.appendChild(b)})}
function next(){current=(current+1)%slides.length;render()}function prev(){current=(current-1+slides.length)%slides.length;render()}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('index').onclick=()=>{current=1;render()};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.getElementById('stage').requestFullscreen();else document.exitFullscreen()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}});window.addEventListener('resize',()=>{if(slides[current].type==='index'&&img.complete)build(slides[current].title)});render();
</script></body></html>
